# pixi.toml — non-Python toolchain & native dependencies for this project.
# Generated by the reproduce-project skill.
#
# DIVISION OF LABOR:
#   - Python packages  -> pyproject.toml + uv   (installed into .venv)
#   - Everything else  -> THIS FILE   + pixi    (installed into .pixi/, no root)
#     CUDA toolkit, compilers (gcc/gxx), cmake/ninja, and native libraries
#     (ffmpeg, opencv, mkl, boost, eigen, protobuf, ...) come from conda-forge.
#
# Do NOT list Python or Python packages here — uv owns those.
# pixi.lock (created by `pixi install`) is committed; the .pixi/ env dir is git-ignored.

[project]
name = "__PROJECT_NAME__"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Agent fills from Phase 1 / Phase 3 discovery. Examples:
# cmake = "*"
# ninja = "*"
# ffmpeg = "*"

# --- CUDA toolchain (uncomment when the native build needs nvcc; see SKILL.md Phase 4) ---
# Version policy: pick the NEWEST-REASONABLE cuda-version that satisfies the project
# floor AND is <= the driver cap — not the floor, not bleeding-edge, a notch below the cap.
# Driver cap examples: driver >=560 -> 12.6, >=570 -> 12.8. So on a 570 driver with a
# "cudatoolkit > 11" project, choose 12.6 (12.8 only if a dep needs it). If the project's
# FLOOR exceeds the cap (e.g. needs >13 on a 570 driver), DO NOT install here — error out.
# cuda-version = "12.6"
# cuda-toolkit = "*"
# cudnn = "*"
# gxx = "*"          # conda-forge C++ compiler matched to the CUDA toolkit

# [system-requirements]
# Declares the host GPU driver's CUDA capability so pixi can solve GPU packages.
# cuda = "12"
